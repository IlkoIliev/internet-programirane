<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid – auto-fit и minmax</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; font-family: Arial, Helvetica, sans-serif; color: #082d46; background: #eef6fb; }
.shirina { position: fixed; right: 6px; bottom: 6px; font: 12px Consolas, monospace; background: #082d46; color: #fff; padding: 2px 6px; border-radius: 4px; }
.galeriya {
  display: grid;
  /* Колкото колони се побират, всяка поне 150px */
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.snimka { height: 80px; border-radius: 8px; background: #174967; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
</style>
</head>
<body>
<div class="galeriya">
  <div class="snimka">1</div><div class="snimka">2</div><div class="snimka">3</div>
  <div class="snimka">4</div><div class="snimka">5</div><div class="snimka">6</div>
</div>
<div class="shirina" aria-hidden="true"></div>
<script>
// Показва текущата ширина на прозореца – само за урока.
const s = document.querySelector(".shirina");
const pokazhi = () => s.textContent = innerWidth + " px";
addEventListener("resize", pokazhi); pokazhi();
</script>
</body>
</html>
