<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лаборатория 3 · Архитектурно предизвикателство</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182c44;font:16px/1.5 system-ui,Arial,sans-serif}header{background:#174c82;color:white;padding:20px max(20px,calc((100% - 960px)/2))}header h1{margin:0;font-size:clamp(22px,3vw,30px)}main{max-width:960px;margin:auto;padding:24px 16px 60px}.panel{background:white;border:1px solid #d8e3f0;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 8px #1b41620d}.muted{color:#526780}.question{padding:15px 0;border-bottom:1px solid #e5edf5}.question:last-child{border:0}select,button{font:inherit;border-radius:8px;padding:9px 12px}select{border:1px solid #9db4c9;max-width:100%;display:block;margin-top:6px;background:white}button{border:0;background:#1765a5;color:white;cursor:pointer;margin:4px}button:disabled{background:#9aaebe;cursor:default}.ghost{background:#e6eef7;color:#184775}.good{color:#126b36}.bad{color:#a52b32}.feedback{background:#f1f6fb;border-radius:8px;padding:12px;margin-top:12px;white-space:pre-line}.progress{font-weight:700;color:#174c82}.rowitem{display:flex;align-items:center;gap:8px;padding:10px;margin:8px 0;background:#f1f6fc;border:1px solid #d4e2ef;border-radius:9px}.rowitem span{flex:1}.rowitem button{min-width:42px}.result{font-size:1.1rem;font-weight:700}a{color:#174c82}@media(max-width:520px){.panel{padding:14px}.rowitem{flex-wrap:wrap}}.assignment{margin:16px 0 20px;padding:15px 18px;background:#eaf3ff;border-left:4px solid #1765a5;border-radius:10px}.assignment p{margin:6px 0 12px}.assignment p:last-child{margin-bottom:0}.assignment .tip{font-size:.94rem;color:#405b77}select{min-width:190px} .assignment{background:#eaf4ff;border-left:4px solid #2277b9;padding:12px 16px;border-radius:9px;margin:12px 0 20px}.assignment p{margin:6px 0}.workspace{display:grid;grid-template-columns:1fr 1.6fr;gap:18px}.tray,.dropzone{min-height:110px;padding:12px;border:2px dashed #b5cce0;border-radius:12px;background:#f8fbff}.zones{display:grid;gap:12px}.dropzone{background:#eef6ff;transition:background .2s,border-color .2s}.dropzone.over{background:#d7ecff;border-color:#1765a5}.dropzone h3,.tray h3{font-size:1rem;margin:0 0 12px}.chip{display:block;width:100%;margin:8px 0;text-align:left;background:white;color:#183e61;border:1px solid #91b4d0;border-radius:9px;padding:11px;cursor:grab;box-shadow:0 2px 4px #174c8211}.chip.selected{outline:3px solid #f4b942;background:#fff8e6}.chip:disabled{opacity:.8;cursor:default}.dropzone .chip{background:#e4f3ff}.note{font-size:.9rem;color:#526780}.assignment strong{color:#174c82}@media(max-width:650px){.workspace{grid-template-columns:1fr}} </style></head><body><header><h1>Лаборатория 3 · Архитектурно предизвикателство</h1><div>Урок 3 · Клиент-сървър комуникация</div></header><main><p>Разположи компонентите в двуслойна или трислойна архитектура.</p><section class="panel"><div id="progress" class="progress"></div><div id="mission"></div><div id="feedback" aria-live="polite"></div><div><button id="check">Провери</button><button id="next" disabled>Следваща мисия</button><button id="restart" class="ghost">Отначало</button></div></section><p class="muted">Работи изцяло в браузъра. Премествай картите с мишка или чрез щракване върху карта и област. Всяка мисия носи максимум 10 точки.</p></main><script>
const missions=[{"title": "Мисия 1: Двуслоен модел", "items": [{"label": "Интерфейс на потребителя", "answer": "Клиент", "why": ""}, {"label": "Програма, която приема заявките", "answer": "Сървър", "why": ""}, {"label": "Визуализиране на получения резултат", "answer": "Клиент", "why": ""}, {"label": "Обработка на заявката", "answer": "Сървър", "why": ""}], "options": ["Клиент", "Сървър"]}, {"title": "Мисия 2: Трислоен модел", "items": [{"label": "Браузър и HTML интерфейс", "answer": "Представяне", "why": ""}, {"label": "Проверка на правата за записване", "answer": "Приложна логика", "why": ""}, {"label": "Съхраняване на записи за участия", "answer": "Данни", "why": ""}, {"label": "Генериране на отговор след бизнес проверка", "answer": "Приложна логика", "why": ""}], "options": ["Представяне", "Приложна логика", "Данни"]}, {"title": "Мисия 3: Система за училищни клубове", "items": [{"label": "Формуляр за избор на клуб", "answer": "Представяне", "why": ""}, {"label": "Проверка за свободни места", "answer": "Приложна логика", "why": ""}, {"label": "Таблица с клубове и участници", "answer": "Данни", "why": ""}, {"label": "Показване на потвърждение", "answer": "Представяне", "why": ""}], "options": ["Представяне", "Приложна логика", "Данни"]}, {"title": "Мисия 4: Архитектурни решения", "items": [{"label": "Директно взаимодействие между клиент и сървър", "answer": "Двуслоен", "why": ""}, {"label": "Отделни логически слоеве за интерфейс, логика и данни", "answer": "Трислоен", "why": ""}, {"label": "Не е задължително да има три физически машини", "answer": "Трислоен", "why": ""}, {"label": "Два основни участника в учебната схема", "answer": "Двуслоен", "why": ""}], "options": ["Двуслоен", "Трислоен"]}];
const missionInstructions=[{"situation": "Разглеждаш опростено уеб приложение с два основни участника: браузър и уеб сървър. Те си разменят заявки и отговори.", "task": "Разпредели всяко действие или компонент между „Клиент“ и „Сървър“. Премести всяка карта в областта „Клиент“ или „Сървър“.", "hint": "Клиентът представя интерфейса, а сървърът приема и обработва заявките."}, {"situation": "Уеб приложението е разделено на три логически слоя: представяне, приложна логика и данни. Това не означава непременно три отделни компютъра.", "task": "Премести всеки компонент в подходящия слой: „Представяне“ (екран и интерфейс), „Приложна логика“ (правила и обработка) или „Данни“ (съхраняване).", "hint": "Разграничавай какво вижда потребителят, какво решава програмата и къде се пази информацията."}, {"situation": "Училището използва система за записване в клубове. Ученикът попълва формуляр, системата проверява свободните места и съхранява записването.", "task": "Определи слоя на всеки от четирите компонента на тази система. Разпредели картите между „Представяне“, „Приложна логика“ и „Данни“.", "hint": "Формулярът е интерфейс; проверката за места е правило; таблицата пази записи."}, {"situation": "Сравняваш две архитектури: при едната има клиент и сървър, а при другата функциите са разделени на три логически слоя.", "task": "Премести всяко твърдение в областта, която описва „Двуслоен“ или „Трислоен“ модел. Отговори на всичките четири твърдения.", "hint": "При трислойния модел броят на логическите слоеве не е задължително броят на физическите машини."}];
let index=0,score=0,checked=false,selected=null,placements={};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function render(){
 checked=false;selected=null;placements={};el('feedback').textContent='';el('check').disabled=false;el('next').disabled=true;
 const m=missions[index],inst=missionInstructions[index];
 el('progress').textContent=`Мисия ${index+1} от ${missions.length} · Събрани точки: ${score}`;
 el('mission').innerHTML=`<h2>${esc(m.title)}</h2><div class="assignment"><p><strong>Ситуация:</strong> ${esc(inst.situation)}</p><p><strong>Твоята задача:</strong> ${esc(inst.task)}</p><p class="note"><strong>Насока:</strong> ${esc(inst.hint)}</p></div><p><strong>Премести всяка карта в подходящата област.</strong> Можеш да я плъзнеш или да я избереш с щракване и след това да натиснеш областта.</p><div class="workspace"><div class="tray" id="tray"><h3>Неразпределени карти</h3><div class="cards" data-zone=""></div></div><div class="zones" id="zones">${m.options.map((x,i)=>`<div class="dropzone" data-zone="${esc(x)}" role="button" tabindex="0" aria-label="Постави картата в ${esc(x)}"><h3>${esc(x)}</h3><div class="cards" data-zone="${esc(x)}"></div></div>`).join('')}</div></div><p class="note">За връщане на карта натисни върху нея и после върху „Неразпределени карти“.</p>`;
 el('tray').setAttribute('role','button');el('tray').tabIndex=0;el('tray').setAttribute('aria-label','Върни картата');
 document.querySelectorAll('.dropzone,#tray').forEach(zone=>{
  zone.addEventListener('click',e=>{if(e.target.closest('.chip'))return;if(selected!==null)move(selected,zone.id==='tray'?'':zone.dataset.zone)});
  zone.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected!==null){e.preventDefault();move(selected,zone.id==='tray'?'':zone.dataset.zone)}});
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');const i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<m.items.length)move(i,zone.id==='tray'?'':zone.dataset.zone)});
 });
 updateCards();
}
function move(i,zone){if(checked)return;placements[i]=zone;selected=null;updateCards()}
function updateCards(){
 const m=missions[index];document.querySelectorAll('.cards').forEach(x=>x.innerHTML='');
 m.items.forEach((it,i)=>{
  const zone=placements[i]||'';const host=[...document.querySelectorAll('.cards')].find(x=>x.dataset.zone===zone);
  const b=document.createElement('button');b.className='chip'+(selected===i?' selected':'');b.textContent=it.label;b.type='button';b.draggable=!checked;b.disabled=checked;
  b.setAttribute('aria-pressed',String(selected===i));b.title='Избери или премести картата';
  b.addEventListener('click',()=>{selected=selected===i?null:i;updateCards()});
  b.addEventListener('dragstart',e=>{selected=i;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});
  host.appendChild(b);
 });
}
function check(){
 if(checked)return;const m=missions[index];
 if(m.items.some((_,i)=>!placements[i])){el('feedback').innerHTML='<div class="feedback bad">Първо разпредели всички карти. Можеш да ги местиш, докато си готов.</div>';return}
 const correct=m.items.filter((it,i)=>placements[i]===it.answer).length;
 const pts=Math.round(correct/m.items.length*10);score+=pts;checked=true;
 const lines=m.items.map((it,i)=>`${i+1}. ${it.label} → ${it.answer}${placements[i]===it.answer?' ✓':' (твоят отговор: '+placements[i]+')'}`);
 const f=document.createElement('div');f.className='feedback';
 const strong=document.createElement('strong');strong.className=correct===m.items.length?'good':'bad';strong.textContent=`Верни: ${correct}/${m.items.length} · ${pts}/10 точки`;
 const details=document.createElement('div');details.textContent=lines.join('\n');f.append(strong,details);el('feedback').replaceChildren(f);
 el('check').disabled=true;el('next').disabled=false;el('next').textContent=index===missions.length-1?'Виж резултата':'Следваща мисия';updateCards();
}
function next(){if(index<missions.length-1){index++;render()}else{
 const max=missions.length*10,pct=score/max*100,grade=pct>=90?6:pct>=75?5:pct>=60?4:pct>=45?3:2;
 el('mission').innerHTML=`<h2>Край на лабораторията</h2><p class="result">${score}/${max} точки (${Math.round(pct)}%) · Оценка ${grade}</p><p>Можеш да повториш лабораторията.</p>`;
 el('progress').textContent='Всички мисии са изпълнени';el('feedback').textContent='';el('check').disabled=true;el('next').disabled=true;
}}
el('check').onclick=check;el('next').onclick=next;el('restart').onclick=()=>{index=0;score=0;render()};render();
</script></body></html>
