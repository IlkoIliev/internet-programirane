<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лаборатория 1 · Кой каква роля изпълнява?</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182c44;font:16px/1.5 system-ui,Arial,sans-serif}header{background:#174c82;color:white;padding:20px max(20px,calc((100% - 960px)/2))}header h1{margin:0;font-size:clamp(22px,3vw,30px)}main{max-width:960px;margin:auto;padding:24px 16px 60px}.panel{background:white;border:1px solid #d8e3f0;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 8px #1b41620d}.muted{color:#526780}.question{padding:15px 0;border-bottom:1px solid #e5edf5}.question:last-child{border:0}select,button{font:inherit;border-radius:8px;padding:9px 12px}select{border:1px solid #9db4c9;max-width:100%;display:block;margin-top:6px;background:white}button{border:0;background:#1765a5;color:white;cursor:pointer;margin:4px}button:disabled{background:#9aaebe;cursor:default}.ghost{background:#e6eef7;color:#184775}.good{color:#126b36}.bad{color:#a52b32}.feedback{background:#f1f6fb;border-radius:8px;padding:12px;margin-top:12px;white-space:pre-line}.progress{font-weight:700;color:#174c82}.rowitem{display:flex;align-items:center;gap:8px;padding:10px;margin:8px 0;background:#f1f6fc;border:1px solid #d4e2ef;border-radius:9px}.rowitem span{flex:1}.rowitem button{min-width:42px}.result{font-size:1.1rem;font-weight:700}a{color:#174c82}@media(max-width:520px){.panel{padding:14px}.rowitem{flex-wrap:wrap}}.assignment{margin:16px 0 20px;padding:15px 18px;background:#eaf3ff;border-left:4px solid #1765a5;border-radius:10px}.assignment p{margin:6px 0 12px}.assignment p:last-child{margin-bottom:0}.assignment .tip{font-size:.94rem;color:#405b77}select{min-width:190px}</style></head><body><header><h1>Лаборатория 1 · Кой каква роля изпълнява?</h1><div>Урок 3 · Клиент-сървър комуникация</div></header><main><p>Разграничи действията на клиента и сървъра. Някои проверки се изпълняват и на двете места.</p><section class="panel"><div id="progress" class="progress"></div><div id="mission"></div><div id="feedback" aria-live="polite"></div><div><button id="check">Провери</button><button id="next" disabled>Следваща мисия</button><button id="restart" class="ghost">Отначало</button></div></section><p class="muted">Работи изцяло в браузъра. Избери отговор от менюто срещу всяко действие. Всяка мисия носи максимум 10 точки.</p></main><script>
const missions=[{"title": "Мисия 1: Интерфейс и визуализация", "items": [{"label": "Показва формуляр за записване", "answer": "Клиент", "why": "Браузърът изгражда потребителския интерфейс."}, {"label": "Изпраща HTTP заявка", "answer": "Клиент", "why": "Клиентският процес инициира заявката."}, {"label": "Връща HTTP отговор", "answer": "Сървър", "why": "Сървърът връща резултата."}, {"label": "Показва съобщение „Успешно“", "answer": "Клиент", "why": "Клиентът визуализира получения резултат."}], "options": ["Клиент", "Сървър", "И двете"]}, {"title": "Мисия 2: Работа с данни", "items": [{"label": "Извлича списък с клубове от база данни", "answer": "Сървър", "why": "Достъпът до базата е сървърна отговорност."}, {"label": "Проверява дали клубът има свободни места", "answer": "Сървър", "why": "Решението трябва да е надеждно на сървъра."}, {"label": "Показва получените клубове в таблица", "answer": "Клиент", "why": "Това е задача на интерфейса."}, {"label": "Записва ново участие в базата", "answer": "Сървър", "why": "Промяната на данните се изпълнява на сървъра."}], "options": ["Клиент", "Сървър", "И двете"]}, {"title": "Мисия 3: Проверки", "items": [{"label": "Проверява дали поле е празно за удобство на потребителя", "answer": "И двете", "why": "Клиентът може да проверява, но сървърът трябва да валидира независимо."}, {"label": "Проверява дали заявителят има право на записване", "answer": "Сървър", "why": "Авторизацията не може да се доверява само на браузъра."}, {"label": "Проверява формата на въведен имейл", "answer": "И двете", "why": "Удобно е да се проверява локално, но и сървърът трябва да валидира."}, {"label": "Съхранява паролите на потребителите", "answer": "Сървър", "why": "Паролите не трябва да се съхраняват от уеб клиента като централен източник."}], "options": ["Клиент", "Сървър", "И двете"]}, {"title": "Мисия 4: Реална ситуация", "items": [{"label": "Потребителят натиска бутон „Запиши ме“", "answer": "Клиент", "why": "Събитието възниква в клиентския интерфейс."}, {"label": "Проверява едновременно записване за последното място", "answer": "Сървър", "why": "Сървърът и базата данни контролират конкурентния достъп."}, {"label": "Показва причина за отказ", "answer": "Клиент", "why": "Браузърът представя получения отказ."}, {"label": "Проверява задължително данните от заявката", "answer": "Сървър", "why": "Сървърът не може да се доверява на входа от клиента."}], "options": ["Клиент", "Сървър", "И двете"]}];const missionInstructions=[{"situation": "Ученик отваря страница за записване в училищен клуб. Браузърът показва формуляр, изпраща заявка и получава отговор от уеб сървъра.", "task": "За всяко действие избери кой го извършва: „Клиент“ (браузърът), „Сървър“ (сървърната програма) или „И двете“. Избери по един отговор на всеки ред и натисни „Провери“.", "hint": "Помисли кой изпраща заявката и кой връща отговора."}, {"situation": "Системата показва клубовете и позволява записване. Част от работата се извършва в браузъра, а друга — на сървъра, който има достъп до базата данни.", "task": "Определи къде се изпълнява всяко действие. „Клиент“ показва информацията, а „Сървър“ обработва и съхранява данните. Избери отговор за всичките четири действия.", "hint": "Попитай се дали действието изисква достъп до сървърната база данни."}, {"situation": "Потребителят въвежда данни за записване. Някои проверки могат да се направят веднага в браузъра, но сървърът трябва независимо да провери получените данни.", "task": "Избери „И двете“ само когато проверката е уместна и на клиента, и на сървъра. За проверка на права или съхраняване на пароли посочи отговорния участник.", "hint": "Проверка в браузъра не замества задължителната проверка на сървъра."}, {"situation": "Двама ученици се опитват да се запишат за последното свободно място в клуб. Системата трябва да предотврати двойно записване и да покаже резултат на потребителя.", "task": "За всяко от четирите действия избери дали се извършва от клиента или сървъра. След това провери отговорите и прочети обясненията.", "hint": "Кой може надеждно да контролира едновременното записване?"}];const mode="roles";let index=0,score=0,checked=false,order=[],answers=[];const el=id=>document.getElementById(id);function shuffled(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){checked=false;el('feedback').innerHTML='';el('check').disabled=false;el('next').disabled=true;let m=missions[index];el('progress').textContent=`Мисия ${index+1} от ${missions.length} · Събрани точки: ${score}`;let inst=missionInstructions[index];let h=`<h2>${m.title}</h2><div class="assignment"><p><strong>Ситуация:</strong> ${inst.situation}</p><p><strong>Твоята задача:</strong> ${inst.task}</p><p class="tip"><strong>Насока:</strong> ${inst.hint}</p></div>`;if(mode==='order'){h+='<p>Подреди действията в правилната последователност:</p><div id="rows"></div>';order=shuffled(m.steps.length)}else{h+='<p><strong>Избери по един отговор за всяко действие:</strong></p>';answers=m.items.map(()=>null);m.items.forEach((it,i)=>{h+=`<div class="question"><strong>${i+1}. ${it.label}</strong><label><span class="muted">Избери роля или слой</span><select data-i="${i}"><option value="">— Избери —</option>${m.options.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label></div>`})}el('mission').innerHTML=h;if(mode==='order')renderOrder();else document.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>answers[+s.dataset.i]=s.value))}function renderOrder(){let m=missions[index];el('rows').innerHTML=order.map((idx,pos)=>`<div class="rowitem"><span>${m.steps[idx]}</span><button class="ghost" data-pos="${pos}" data-dir="-1" aria-label="Премести нагоре" ${pos===0?'disabled':''}>↑</button><button class="ghost" data-pos="${pos}" data-dir="1" aria-label="Премести надолу" ${pos===order.length-1?'disabled':''}>↓</button></div>`).join('');el('rows').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{let p=+b.dataset.pos,q=p+(+b.dataset.dir);[order[p],order[q]]=[order[q],order[p]];renderOrder()}))}function check(){if(checked)return;let m=missions[index],total=mode==='order'?m.steps.length:m.items.length;let correct=0,lines=[];if(mode==='order'){order.forEach((v,i)=>{if(v===i)correct++});lines.push('Правилна последователност:');m.steps.forEach((x,i)=>lines.push(`${i+1}. ${x}`))}else{m.items.forEach((it,i)=>{if(answers[i]===it.answer)correct++;lines.push(`${i+1}. ${it.label} → ${it.answer}${it.why?' — '+it.why:''}`)})}let pts=Math.round(correct/total*10);score+=pts;checked=true;el('feedback').innerHTML=`<div class="feedback"><strong class="${correct===total?'good':'bad'}">Верни: ${correct}/${total} · ${pts}/10 точки</strong><div>${lines.join('\n')}</div></div>`;el('check').disabled=true;el('next').disabled=false;el('next').textContent=index===missions.length-1?'Виж резултата':'Следваща мисия';el('rows')?.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelectorAll('select').forEach(s=>s.disabled=true)}function next(){if(index<missions.length-1){index++;render()}else{let max=missions.length*10,pct=score/max*100,grade=pct>=90?6:pct>=75?5:pct>=60?4:pct>=45?3:2;el('mission').innerHTML=`<h2>Край на лабораторията</h2><p class="result">${score}/${max} точки (${Math.round(pct)}%) · Оценка ${grade}</p><p>Можеш да повториш лабораторията, за да затвърдиш знанията.</p>`;el('progress').textContent='Всички мисии са изпълнени';el('feedback').innerHTML='';el('check').disabled=true;el('next').disabled=true}}el('check').onclick=check;el('next').onclick=next;el('restart').onclick=()=>{index=0;score=0;render()};render();</script></body></html>
