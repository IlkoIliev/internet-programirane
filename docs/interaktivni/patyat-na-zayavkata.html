<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лаборатория 2 · Пътят на една заявка</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182c44;font:16px/1.5 system-ui,Arial,sans-serif}header{background:#174c82;color:white;padding:20px max(20px,calc((100% - 960px)/2))}header h1{margin:0;font-size:clamp(22px,3vw,30px)}main{max-width:960px;margin:auto;padding:24px 16px 60px}.panel{background:white;border:1px solid #d8e3f0;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 8px #1b41620d}.muted{color:#526780}.assignment{background:#edf5ff;border-left:4px solid #1765a5;border-radius:8px;padding:12px 16px;margin:14px 0 20px}.assignment p{margin:6px 0}.question{padding:15px 0;border-bottom:1px solid #e5edf5}.question:last-child{border:0}select,button{font:inherit;border-radius:8px;padding:9px 12px}select{border:1px solid #9db4c9;max-width:100%;display:block;margin-top:6px;background:white}button{border:0;background:#1765a5;color:white;cursor:pointer;margin:4px}button:disabled{background:#9aaebe;cursor:default}.ghost{background:#e6eef7;color:#184775}.good{color:#126b36}.bad{color:#a52b32}.feedback{background:#f1f6fb;border-radius:8px;padding:12px;margin-top:12px;white-space:pre-line}.progress{font-weight:700;color:#174c82}.rowitem{display:flex;align-items:center;gap:8px;padding:10px;margin:8px 0;background:#f1f6fc;border:1px solid #d4e2ef;border-radius:9px}.rowitem span{flex:1}.rowitem button{min-width:42px}.result{font-size:1.1rem;font-weight:700}a{color:#174c82}@media(max-width:520px){.panel{padding:14px}.rowitem{flex-wrap:wrap}}</style></head><body><header><h1>Лаборатория 2 · Пътят на една заявка</h1><div>Урок 3 · Клиент-сървър комуникация</div></header><main><p>Подреди стъпките от действието на потребителя до визуализиране на резултата.</p><section class="panel"><div id="progress" class="progress"></div><div id="mission"></div><div id="feedback" aria-live="polite"></div><div><button id="check">Провери</button><button id="next" disabled>Следваща мисия</button><button id="restart" class="ghost">Отначало</button></div></section><p class="muted">Работи изцяло в браузъра. За преместване на стъпки използвай стрелките ↑ и ↓. Всяка мисия носи максимум 10 точки.</p></main><script>
const missions=[{"title": "Мисия 1: Отваряне на страница", "steps": ["Потребителят въвежда URL", "Браузърът изпраща HTTP заявка", "Сървърът намира искания HTML ресурс", "Сървърът изпраща HTTP отговор", "Браузърът визуализира страницата"]}, {"title": "Мисия 2: Списък с клубове", "steps": ["Ученикът отваря списъка с клубове", "Клиентът изпраща заявка за списъка", "Приложението извлича данните за клубовете", "Сървърът връща резултат", "Браузърът показва клубовете"]}, {"title": "Мисия 3: Записване", "steps": ["Ученикът попълва формуляра", "Браузърът проверява задължителните полета", "Клиентът изпраща заявка за записване", "Сървърът проверява правилата и записва участието", "Клиентът показва съобщение за успех"]}, {"title": "Мисия 4: Отказ при липса на места", "steps": ["Ученикът избира запълнен клуб", "Клиентът изпраща заявка", "Сървърът проверява свободните места", "Сървърът връща отказ без да записва участие", "Браузърът показва причината за отказ"]}, {"title": "Мисия 5: Статичен ресурс", "steps": ["Браузърът открива адреса на изображение в HTML", "Браузърът изпраща заявка за изображението", "Уеб сървърът намира файла", "Сървърът връща съдържанието на изображението", "Браузърът показва изображението"]}];const missionInstructions=[{"title": "Отваряне на уеб страница", "situation": "Отваряш браузъра и въвеждаш адреса на училищния сайт. След малко началната страница се появява на екрана.", "task": "Подреди петте действия така, че да проследиш пътя на заявката от браузъра до сървъра и връщането на резултата. Постави първото действие най-отгоре."}, {"title": "Разглеждане на училищни клубове", "situation": "Ученик отваря електронната система на училището, за да разгледа наличните клубове. Списъкът се зарежда от сървъра.", "task": "Подреди действията от избора на списъка до показването на клубовете в браузъра. Обърни внимание кой изпраща заявката и кой извлича данните."}, {"title": "Записване в училищен клуб", "situation": "Ученик попълва формуляр и натиска бутона за записване. Системата проверява данните и потвърждава участието.", "task": "Подреди стъпките от попълването на формуляра до съобщението за успешно записване. Разграничи проверката в браузъра от проверката и записа на сървъра."}, {"title": "Отказ при липса на свободни места", "situation": "Ученик се опитва да се запише в клуб, в който вече няма свободни места. Системата трябва да откаже записването и да обясни причината.", "task": "Подреди действията така, че сървърът първо да провери свободните места, а след това браузърът да покаже отказа. Не допускай записване на участие при запълнен клуб."}, {"title": "Зареждане на изображение", "situation": "Уеб страницата съдържа изображение. За да го покаже, браузърът трябва да получи файла от уеб сървъра.", "task": "Подреди действията от откриването на адреса на изображението в HTML до появата му на екрана. Проследи отделната заявка за този ресурс."}];const mode="order";let index=0,score=0,checked=false,order=[],answers=[];const el=id=>document.getElementById(id);function shuffled(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){checked=false;el('feedback').innerHTML='';el('check').disabled=false;el('next').disabled=true;let m=missions[index];el('progress').textContent=`Мисия ${index+1} от ${missions.length} · Събрани точки: ${score}`;let info=missionInstructions[index];let h=`<h2>${m.title}</h2><div class="assignment"><p><strong>Ситуация:</strong> ${info.situation}</p><p><strong>Твоята задача:</strong> ${info.task}</p></div>`;if(mode==='order'){h+='<p><strong>Подреди картите с бутоните ↑ и ↓:</strong></p><div id="rows"></div>';order=shuffled(m.steps.length)}else{h+='<p>Избери правилната роля или слой за всяко действие:</p>';answers=m.items.map(()=>null);m.items.forEach((it,i)=>{h+=`<div class="question"><strong>${i+1}. ${it.label}</strong><label><span class="muted">Твоят отговор</span><select data-i="${i}"><option value="">— Избери —</option>${m.options.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label></div>`})}el('mission').innerHTML=h;if(mode==='order')renderOrder();else document.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>answers[+s.dataset.i]=s.value))}function renderOrder(){let m=missions[index];el('rows').innerHTML=order.map((idx,pos)=>`<div class="rowitem"><span>${m.steps[idx]}</span><button class="ghost" data-pos="${pos}" data-dir="-1" aria-label="Премести нагоре" ${pos===0?'disabled':''}>↑</button><button class="ghost" data-pos="${pos}" data-dir="1" aria-label="Премести надолу" ${pos===order.length-1?'disabled':''}>↓</button></div>`).join('');el('rows').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{let p=+b.dataset.pos,q=p+(+b.dataset.dir);[order[p],order[q]]=[order[q],order[p]];renderOrder()}))}function check(){if(checked)return;let m=missions[index],total=mode==='order'?m.steps.length:m.items.length;let correct=0,lines=[];if(mode==='order'){order.forEach((v,i)=>{if(v===i)correct++});lines.push('Правилна последователност:');m.steps.forEach((x,i)=>lines.push(`${i+1}. ${x}`))}else{m.items.forEach((it,i)=>{if(answers[i]===it.answer)correct++;lines.push(`${i+1}. ${it.label} → ${it.answer}${it.why?' — '+it.why:''}`)})}let pts=Math.round(correct/total*10);score+=pts;checked=true;el('feedback').innerHTML=`<div class="feedback"><strong class="${correct===total?'good':'bad'}">Верни: ${correct}/${total} · ${pts}/10 точки</strong><div>${lines.join('\n')}</div></div>`;el('check').disabled=true;el('next').disabled=false;el('next').textContent=index===missions.length-1?'Виж резултата':'Следваща мисия';el('rows')?.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelectorAll('select').forEach(s=>s.disabled=true)}function next(){if(index<missions.length-1){index++;render()}else{let max=missions.length*10,pct=score/max*100,grade=pct>=90?6:pct>=75?5:pct>=60?4:pct>=45?3:2;el('mission').innerHTML=`<h2>Край на лабораторията</h2><p class="result">${score}/${max} точки (${Math.round(pct)}%) · Оценка ${grade}</p><p>Можеш да повториш лабораторията, за да затвърдиш знанията.</p>`;el('progress').textContent='Всички мисии са изпълнени';el('feedback').innerHTML='';el('check').disabled=true;el('next').disabled=true}}el('check').onclick=check;el('next').onclick=next;el('restart').onclick=()=>{index=0;score=0;render()};render();</script></body></html>
