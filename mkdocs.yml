
site_name: Интернет програмиране
site_description: Електронен учебник по Интернет програмиране
site_url: https://ilkolliev.github.io/internet-programirane/

theme:
  name: material
  language: bg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy


nav:
  - Начало: index.md

  - Теория:
      - Въведение: teoria/index.md
      - Раздел 1:
          - Преглед на раздела: teoria/razdel-1/index.md
          - "Урок 1. Основи на интернет": teoria/razdel-1/urok-01-osnovi-na-internet.md
          - "Урок 2. HTTP. Видове HTTP заявки": teoria/razdel-1/urok-02-http-vidove-zayavki.md
      - Раздел 2: teoria/razdel-2/index.md
      - Раздел 3: teoria/razdel-3/index.md
      - Раздел 4: teoria/razdel-4/index.md

  - Практика:
      - Въведение: praktika/index.md
      - Раздел 1: praktika/razdel-1/index.md
      - Раздел 2: praktika/razdel-2/index.md
      - Раздел 3: praktika/razdel-3/index.md
      - Раздел 4: praktika/razdel-4/index.md
      - Раздел 5: praktika/razdel-5/index.md

  - Общ проект: proekt/index.md
  - Ресурси: resursi/index.md


markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
