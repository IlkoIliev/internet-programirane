
site_name: Интернет програмиране
site_description: Електронен учебник по Интернет програмиране
site_url: https://ilkolliev.github.io/internet-programirane/

theme:
  name: material
  language: bg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Начало: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
